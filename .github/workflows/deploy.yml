name: Deploy

on:
  schedule:
    - cron: "0 * * * *"   # 每小时更新一次
  workflow_dispatch:           # 允许手动触发

# 部署到 GitHub Pages 需要写权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，避免并发冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache 根目录 node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-root-${{ hashFiles('package-lock.json') }}

      - name: Cache web/node_modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node20-web-${{ hashFiles('web/package-lock.json') }}

      - name: 安装根目录依赖
        run: npm install

      - name: 拉取 RSS 并生成静态资产
        run: npm run gen

      - name: 安装前端依赖并构建
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

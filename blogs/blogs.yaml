# blogs.yaml — IppClub Blogroll 博客数据源
#
# 字段说明：
#   name       (string,  必填): 博客展示名称
#   html       (string,  必填): 博客 HTML 地址
#   rss        (string,  可选): RSS/Atom 地址，没有 RSS 则填 "---"
#   github     (string,  可选): 博主 GitHub 用户名
#   department (string,  可选): 院系
#   tags       (list,    可选): 标签列表
#   active     (boolean, 默认 true): 是否激活（false 表示暂停抓取）

- name: "OrangeX4's Blog"
  html: "https://blog.orangex4.workers.dev/"
  rss: "https://blog.orangex4.workers.dev/atom.xml"
  github: "OrangeX4"
  department: "计算机科学与工程学院"
  tags:
    - "技术"
    - "数学"
    - "Neovim"
  active: true

